<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<header class="bp-header">
  <div class="bp-header__inner">
    <div class="bp-header__brand">
      {% if module.logo.src %}
        <img class="bp-header__logo"
             src="{{ module.logo.src }}"
             alt="{{ module.logo.alt|escape }}"
             width="{{ module.logo.width|default(238) }}"
             height="{{ module.logo.height|default(119) }}" />
      {% else %}
        <span class="bp-header__wordmark">b<span class="bp-header__plus">+</span>p</span>
      {% endif %}
    </div>

    {% if module.phone_display %}
      <a class="bp-header__phone" href="tel:{{ module.phone_tel|default('#') }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z"/>
        </svg>
        <span>{{ module.phone_display }}</span>
      </a>
    {% endif %}
  </div>
</header>
